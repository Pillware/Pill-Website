<!doctype html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8" />
    <!-- Raster light/dark pair: engines that do not rasterize the SVG favicon
         (e.g. older Android Chrome) still follow the browser theme. -->
    <link rel="icon" type="image/png" href="/favicons/favicon-96x96.png" sizes="96x96" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/png" href="/favicons/favicon-96x96-dark.png" sizes="96x96" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicons/favicon.svg" />
    <link rel="shortcut icon" href="/favicons/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Pill Engine" />
    <link rel="manifest" href="/favicons/site.webmanifest" />
    <!-- AI / LLM discovery: curated project index for agents -->
    <link rel="alternate" type="text/plain" href="/llms.txt" title="LLM-friendly overview" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Pill Engine is a modern, free and blazingly fast game engine built for developers who refuse to compromise: raw performance and creative freedom for even the wildest ideas." />
    <meta name="keywords" content="Pill Engine, game engine, rust, ECS, 3D graphics, game development, blazing fast" />
    <meta name="application-name" content="Pill Engine" />
    <!-- pillengine.org is the canonical host: robots.txt, the press kit and the
         deploy workflows name it, while pill.rocks is an alias of the same
         webroot. Each route gets its own canonical URL at build time. -->
    <link rel="canonical" href="https://pillengine.org/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Pill Engine" />
    <meta property="og:title" content="Pill Engine - Modern, free and blazingly fast game engine" />
    <meta property="og:description" content="Pill Engine is a modern, free and blazingly fast game engine built for developers who refuse to compromise: raw performance and creative freedom for even the wildest ideas." />
    <meta property="og:url" content="https://pillengine.org/" />
    <title>Pill Engine - Modern, free and blazingly fast game engine</title>
    <!-- website-structured-data: Google reads WebSite structured data from the
         home page as a site-name signal. Keep the name in sync with og:site_name
         and the visible brand. -->
    <script type="application/ld+json" id="website-structured-data">
        {
            "@context": "https://schema.org",
            "@type": "WebSite",
            "name": "Pill Engine",
            "alternateName": "Pill",
            "url": "https://pillengine.org/"
        }
    </script>
    <!-- Above-the-fold assets: preload the two variable fonts and the hero
         logo so they start downloading before React mounts. -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/inter-variable-latin.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/outfit-variable-latin.woff2" crossorigin />
    <link rel="preload" as="image" href="/logos/pill_logo_white.svg" fetchpriority="high" />
    <!-- Analytics. The data-domains allow-list keeps the tracker off
         localhost and preview deployments; both production domain families
         (pillengine.org and pill.rocks) are whitelisted. -->
    <script defer src="https://umami.pillengine.org/script.js"
        data-website-id="be02f2ef-9344-46d7-bc07-c9c56af6531e"
        data-domains="pillengine.org,www.pillengine.org,docs.pillengine.org,pill.rocks,www.pill.rocks,docs.pill.rocks"></script>
</head>

<body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
</body>

</html>
