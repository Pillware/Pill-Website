name: Build and Deploy Website

on:
  push:
    branches:
      - main
    paths:
      - "landing_page/**"
      - "docs_page/**"
      - "build-script.js"
      - "package.json"
      - .github/workflows/deploy.yml

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3. Install all dependencies
      - name: Install dependencies
        run: |
          npm install
          cd landing_page && npm install
          cd ../docs_page && npm install

      # 4. Build both sites (uses root build script)
      - name: Build landing page and docs
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY}}
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY }}
        run: npm run build

      # 5. Deploy to server via SSH
      - name: Deploy to Server
        run: |
          set -e

          echo "=== Build output ==="
          ls -la dist/
          echo ""
          echo "=== File count ==="
          find dist -type f | wc -l
          echo ""
          echo "=== Deploy target ==="
          echo "Host: ${{ secrets.SERVER_HOST }}"
          echo "User: ${{ secrets.SERVER_USER }}"
          echo "Port: ${{ secrets.SERVER_PORT || 22 }}"
          echo ""

          # Write SSH key
          echo "${{ secrets.LANDING_PAGE_KEY }}" > landing_page_key
          chmod 600 landing_page_key

          # Deploy via SSH with verbose logging
          tar -czf - -C dist . | \
            ssh -v -i landing_page_key \
                -o StrictHostKeyChecking=no \
                -o ConnectTimeout=30 \
                -p ${{ secrets.SERVER_PORT || 22 }} \
                ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} 2>&1

          echo ""
          echo "=== Landing deployed to pill.rocks ==="

          rm -f landing_page_key

      # 6. Deploy docs to docs.pill.rocks. Uses a SEPARATE deploy key whose
      #    authorized_keys forced command extracts into the docs webroot
      #    (same pattern as the landing deploy above).
      #    One-time server setup:
      #      1. Generate a second SSH keypair.
      #      2. Append the public key to ~/.ssh/authorized_keys with a forced
      #         command, e.g.:
      #           command="tar -xzf - -C /path/to/docs.pill.rocks",restrict ssh-ed25519 AAAA...
      #      3. Store the private key as the DOCS_PAGE_KEY GitHub secret.
      #    NOTE: the `secrets` context is NOT allowed in `if:` conditions, so
      #    the "is the key configured?" check happens inside the script below.
      - name: Deploy Docs (docs.pill.rocks)
        env:
          DOCS_PAGE_KEY: ${{ secrets.DOCS_PAGE_KEY }}
        run: |
          set -e

          # Skip with a warning when the docs deploy key has not been set up.
          if [ -z "$DOCS_PAGE_KEY" ]; then
            echo "::warning::DOCS_PAGE_KEY secret is not set - docs.pill.rocks was NOT deployed."
            echo "See the 'Deploy Docs (docs.pill.rocks)' step comments for the one-time server setup."
            exit 0
          fi

          echo "=== Docs output ==="
          ls -la dist-docs/
          echo ""
          echo "=== Deploying docs ==="

          echo "$DOCS_PAGE_KEY" > docs_page_key
          chmod 600 docs_page_key

          tar -czf - -C dist-docs . | \
            ssh -i docs_page_key \
                -o StrictHostKeyChecking=no \
                -o ConnectTimeout=30 \
                -p ${{ secrets.SERVER_PORT || 22 }} \
                ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} 2>&1

          rm -f docs_page_key
          echo ""
          echo "=== Docs deployed to docs.pill.rocks ==="
